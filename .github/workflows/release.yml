# Attaches every package to a GitHub release. RELEASING.md is the procedure.
#
# Publishing a release on GitHub is the trigger, and GitHub creates the tag itself, so a release
# never depends on a tag being pushed from a terminal.
#
# A draft can be filled first instead, with a dispatch naming its tag. That avoids the window where
# a published release is live with no downloads attached to it. GitHub does not create the tag
# until the draft is published, so there is nothing for MinVer to read yet: the version is taken
# from the tag name that was given instead, and publishing then creates that tag on the same
# commit, so the two agree.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      draft_tag:
        description: "Attach the packages to this draft release, e.g. v0.2.0. Leave empty to rehearse the build without uploading anything."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.draft_tag || github.ref }}
  cancel-in-progress: false # Never interrupt a release build half-way.

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A tag that is not vX.Y.Z or vX.Y.Z-something would build packages whose version no package
      # manager can sort, so it is refused before anything is built.
      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.draft_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Rehearsal: MinVer reads the version from the tags."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a version tag of the form v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG#v}"

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      matrix: '[{"rid": "linux-x64", "runner": "ubuntu-24.04"}, {"rid": "linux-arm64", "runner": "ubuntu-24.04-arm"}]'
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    # Either a real release, or a dispatch that named a draft to fill.
    if: github.event_name == 'release' || inputs.draft_tag != ''
    permissions:
      contents: write # Needed to attach the packages to the release.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snapshotkit-*
          path: artifacts

      - name: Collect the packages and checksum them
        run: |
          mkdir -p upload
          find artifacts -type f -exec mv {} upload/ \;
          cd upload
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      # A draft is addressable by the tag name it will eventually get, so the same command serves
      # both paths.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.draft_tag }}
        run: gh release upload "$TAG" upload/* --clobber --repo "${{ github.repository }}"
