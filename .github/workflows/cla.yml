# Holds a pull request until its author has signed the contributor licence agreement.
#
# The agreement is in CLA.md, and the reason for it is written there rather than repeated here:
# SnapShotKit is source-available and may be relicensed later, which is impossible if every
# contributor keeps an unlicensed hold over their own patch. This workflow is what makes asking
# reliable rather than something remembered on a good day.
#
# Signatures are recorded on the `cla-signatures` branch rather than on `main`, so that a bot
# never writes to the branch the software is built from. That branch has to exist before the first
# pull request arrives. From a clean working tree, once:
#
#     git switch --orphan cla-signatures
#     git commit --allow-empty -m "Signatures for the contributor licence agreement"
#     git push -u origin cla-signatures
#     git switch main
#
# `pull_request_target` is deliberate. It is the only pull request trigger that gives the write
# permission needed to record a signature and set a status on a fork's pull request. It is safe
# here because nothing in this workflow checks out or runs the contributor's code: the action only
# reads comments and writes a JSON file.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest

    steps:
      # Comments are the signing mechanism, so every comment on every issue would otherwise start
      # this job. Only the two that mean something get through.
      - name: Check the signature
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/dvdstelt/SnapShotKit/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures

          # The copyright holder cannot license work to himself, and a bot cannot agree to
          # anything.
          allowlist: dvdstelt,dependabot[bot],renovate[bot]

          custom-notsigned-prcomment: >
            Thank you for this. Before it can be merged, please read
            [the contributor licence agreement](https://github.com/dvdstelt/SnapShotKit/blob/main/CLA.md)
            and sign it by posting the sentence below as a comment. You keep the copyright in what
            you wrote, and anyone with a merged pull request gets a free licence to SnapShotKit.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Signed, thank you. Every pull request you open from now on is covered.
